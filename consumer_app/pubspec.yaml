name: consumer_app
description: Puja Platform - Consumer Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Supabase
  supabase_flutter: ^2.5.0
  # Navigation
  go_router: ^13.2.0
  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  # DI
  get_it: ^7.7.0
  injectable: ^2.3.2
  # Network
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Media
  image_picker: ^1.1.2
  # Permissions
  permission_handler: ^11.3.1
  # Notifications
  flutter_local_notifications: ^17.1.2
  firebase_messaging: ^15.0.4
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  build_runner: ^2.4.9
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts: []
